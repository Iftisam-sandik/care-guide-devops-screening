<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590">
  <rect width="800" height="590" fill="#f8fafc"/>

  <text x="400" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#0f172a">
    DevOps CI &amp; Deployment Workflow
  </text>

  <rect x="110" y="75" width="580" height="85" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1e40af">1. Code Commit &amp; Push</text>
  <text x="400" y="137" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">GitHub Repository - main branch</text>

  <path d="M400 160 V190" stroke="#475569" stroke-width="3"/>
  <polygon points="392,182 408,182 400,194" fill="#475569"/>

  <rect x="110" y="195" width="580" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="229" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#075985">2. GitHub Actions CI</text>
  <text x="400" y="255" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Lint + Test + Bash Check + Docker Build</text>
  <text x="400" y="278" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Container Verification</text>

  <path d="M400 295 V325" stroke="#475569" stroke-width="3"/>
  <polygon points="392,317 408,317 400,329" fill="#475569"/>

  <rect x="110" y="330" width="580" height="85" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="363" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#166534">3. Docker Hub</text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Publish Public Docker Image (latest + commit SHA)</text>

  <path d="M400 415 V445" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="392,437 408,437 400,449" fill="#475569"/>

  <rect x="110" y="450" width="580" height="85" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="483" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#334155">4. AWS EC2 / VPS Deployment</text>
  <text x="400" y="512" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Pull Image and Run Container (Manual / Planned)</text>

  <text x="400" y="565" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748b">
    Automated CI ends at Docker Hub. VPS deployment is documented, not automated.
  </text>
</svg>
