name: DevOps CI Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: iftisamsandik/care-guide-devops-screening

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npx eslint src tests

      - name: Test Application
        run: npm test

      - name: Check Bash Syntax
        run: bash -n system_health.sh

      - name: Build Docker Image
        run: docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:$GITHUB_SHA" .

      - name: Test Docker Container
        run: |
          docker run -d --name app-test -p 127.0.0.1:8080:8080 "$IMAGE_NAME:latest"
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
